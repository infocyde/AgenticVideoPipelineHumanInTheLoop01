# Brief Kit settings, read by the pipeline scripts. Edit freely; comments are fine.

voice:
  # Local text-to-speech for the voiceover, instead of ElevenLabs or a recording.
  #   true:  after script approval the producer runs `npm run voice -- <slug>`, which reads voiceover.txt and writes
  #          public/episodes/<slug>/voiceover.mp3 (then aligns it).
  #   false: you bring voiceover.mp3 yourself, as before. `npm run voice -- <slug>` refuses unless you pass --ignore-off
  #          (--sample auditions always work, so you can try voices before turning this on).
  enabled: true

  # chatterbox: Resemble AI Chatterbox (MIT). Clones the voice in `reference`. English only.
  # qwen:       Qwen3-TTS (Apache-2.0). Clones the voice in `reference`. Multilingual model (incl. Russian), so it
  #             tends to say Russian/Ukrainian names better. Needs: npm run setup:voice -- --qwen
  # kokoro:     Kokoro-82M (Apache-2.0). Preset voices only, very fast. Good for drafts and long scripts.
  # qwen-cloud: the same Qwen3-TTS voice clone, run on Replicate (official qwen/qwen3-tts) with every sentence sent at
  #             once: about a minute for an episode instead of ~7 locally, roughly 2.6 s of Replicate GPU time per
  #             sentence (cents per episode). Needs REPLICATE_API_TOKEN; uploads the reference clip to Replicate.
  #             No seed input, so a re-run gives a different take. Local qwen stays the fallback: --engine qwen.
  # elevenlabs: the ElevenLabs API with the voice and settings in `elevenlabs:` below (no reference clip). Needs
  #             ELEVENLABS_API_KEY in .env (this folder or a parent); billed per character of script. One-off:
  #             --engine elevenlabs. The elevenlabs skill (.claude/skills/elevenlabs/SKILL.md) has the details.
  engine: qwen-cloud

  # The voice to clone (chatterbox and qwen): 10-20 s of clean speech, one speaker, no music, in voices/.
  # Must be your own voice or one you have the rights to. List them: npm run voice -- --voices
  # One-off: --reference voices/<name>.wav  (or --reference none for Chatterbox standard's built-in voice)
  # collin_ro: Collin's voice,  Chosen 2026-10-19 after comparing all voices with Qwen 1.7B.
  reference: voices/collin_ro.wav

  chatterbox:
    # turbo (default): 350M, fast (~2-3x realtime here), English. Needs a reference clip.
    # standard: 500M, about half the speed, reads names a little better (e.g. Russian/Ukrainian places),
    #           has exaggeration / cfg_weight controls and a built-in default voice. One-off: --model standard
    model: turbo
    exaggeration: 0.5   # standard model only: 0.25 flat .. 1.0 dramatic
    cfg_weight: 0.5     # standard model only: lower = slower, more deliberate delivery

  qwen:
    size: 1.7B          # 1.7B (better, ~6 GB VRAM) | 0.6B (lighter, ~4 GB). One-off: --size 0.6B (local only)
    cloud_concurrency: 8  # qwen-cloud: sentences sent to Replicate at once (--concurrency N)
    language: English   # the narration's language (Chinese, English, Japanese, Korean, German, French, Russian,
                        # Portuguese, Spanish, Italian). Names inside English text are still read by a model that
                        # knows Russian. It also needs a transcript of the reference clip: voices/<name>.txt, made
                        # automatically with Whisper the first time (fix it by hand if a word is wrong).

  kokoro:
    voice: am_michael   # list them with: npm run voice -- --voices
    speed: 1.0

  elevenlabs:
    voice: hacker_01    # a voice name on your account (case-insensitive) or a raw voice_id; list: npm run voice -- --voices
                        # One-off: --voice <name|id>. Looking a name up needs the key's Voices: Read permission.
    voice_id: D6xaKuxxRltWlGUSrxmR  # hacker_01; optional: the voice's ID (My Voices -> the voice -> ID). Skips the name lookup, so it works with
                        # a key that only has Text to Speech. Leave empty to look `voice` up by name.
    model: eleven_v4    # the user's choice (2026-10-29): v4, or eleven_v4_turbo (cheaper; both tested on the TTS API). Alternatives:
                        # eleven_multilingual_v2 (most stable for narration, 29 languages), eleven_v3 (most dramatic, no
                        # request-id stitching), eleven_flash_v2_5 (half the price per character, a little flatter).
                        # One-off: --model <id>
    stability: 0.5      # user default 50%. 0..1: lower = more expressive and varied, higher = steadier and flatter (--stability)
    similarity_boost: 0.75  # user default 75%. 0..1: how closely it sticks to the voice (--similarity)
    style: 0.0          # 0..1: exaggerates the voice's style; above 0 costs latency and can wobble (--style)
    speaker_boost: true # a little closer to the original speaker
    speed: 1.0          # 0.7..1.2 (--speed)
    output_format: mp3_44100_128   # 44.1 kHz MP3 works on every plan; mp3_44100_192 needs Creator+, pcm_44100 Pro+
    stitch: text        # continuity between sentences: text = send the neighbouring sentences as context (sentences
                        # run in parallel); ids = one at a time, chained by request id (ElevenLabs' preferred method,
                        # slower, not for eleven_v3); off = each sentence alone. One-off: --stitch ids
    concurrency: 3      # sentences in flight at once; your plan's limit: Free 2, Starter 3, Creator 5, Pro 10 (--concurrency)

  pause: 0.35           # seconds of silence between sentences (paragraph breaks get double)
  seed: 7               # same seed + same text = same take; change it to get a different read

shorts:
  # YouTube Shorts (vertical 9:16, 1080x1920) made alongside each episode.
  #   true:  at script approval the producer also writes 1-3 Short scripts (each its own 30-60 s script from the
  #          episode's facts), scaffolds them with `npm run short -- <slug>`, and builds and renders them after the
  #          main video. Each Short is its own small episode: <slug>-short1, -short2, ...
  #   false: no Shorts unless you ask. A standalone Short (not from an episode) is always available:
  #          npm run new -- <slug> --format short
  enabled: false
  count: 2          # Shorts per episode, 1-3 (the producer picks the strongest items)
  maxSeconds: 60    # target length; check warns above this (YouTube allows up to 3 minutes)

  # Long Shorts: vertical like any Short, but 1 to 2.5 minutes with 2-10 chapters, a chapter rail across the top,
  # and every image, infographic and clip shown whole in a card (never cropped to the tall frame). "long": true in
  # episode.json. Make one standalone (npm run new -- <slug> --format long-short) or from an episode
  # (npm run short -- <slug> --long). The new-episode skill, section 8b, has the procedure.
  long:
    minSeconds: 60    # check warns below this...
    maxSeconds: 150   # ...and above this (2:30)
    musicLevel: 0.6   # audio.music.level in every new long Short (louder than the 0.45 episode default)
    voiceSpeed: 1.0   # audio.voiceSpeed: npm run voice plays the take back this much faster (pitch kept), then aligns
                      # 1.0 from 2026-11-01 (viewers found 1.1-1.2x too fast): ~2.6 words a second, ~155 words for 1:00, ~390 for 2:30
    voiceEngine: qwen # long Shorts are voiced with local Qwen3-TTS (the user's choice, 2026-11-01), not voice.engine
                      # (the auto run uses auto_long_shorts.voiceEngine instead, ElevenLabs since 2026-11-02):
                      # the producer runs `npm run voice -- <slug> --engine qwen`. Local takes repeat for the same
                      # seed, so a re-voice needs --seed <n>. It runs on the GPU: never alongside compose, render
                      # or another local voicing.
    scenes: 5         # chapters in a new long Short (--count 2-10 overrides)
    theme: dispatch   # theme of a standalone long Short (signal yellow on ink, made for this layout); --theme overrides

music_gen:
  # Local background music with Stable Audio 3 (Stability AI), instead of a library or hand-made bed.
  #   true:  for every episode and Short the producer writes a prompt that fits the theme and mood and runs
  #          `npm run compose -- <slug> bed --prompt "..."`, which writes public/episodes/<slug>/music/bed.mp3 sized to
  #          the video, level-matched to the library bed, credited AI-GENERATED (Powered by Stability AI). You hear it in
  #          the preview, as with any bed. Your own tracks still win when you hand one over.
  #   false: no generated music; beds come from the library, the episode's music/ folder or your own tracks.
  # Setup once: npm run setup:music. The weights are gated on Hugging Face (accept the terms, then log in), and a
  # monetized channel needs the free Stability AI Community License registration (under $1M revenue a year).
  # Every bed gets a fresh random seed; it is recorded in credits.json (re-make one with --seed).
  enabled: true
  model: medium       # medium (1.4B, GPU + Flash Attention, up to 6:20 per pass) | small-music (433M, CPU OK, up to 2:00)
  steps: 8            # sampling steps (8 is the model's default; more doesn't help the post-trained models)
  lufs: -20.3         # integrated loudness of the bed (matches public/library/music/bed.mp3)

image_gen:
  # Where AI stills come from (npm run generate; the generate-image skill: a fallback when licensed footage fails).
  #   local_render: every still on this GPU with Z-Image Turbo (Tongyi-MAI, Apache-2.0), free, ~35-55 s each
  #   cloud_render: every still with FLUX 3 (Black Forest Labs) via Replicate, a paid API call each
  #   mixed:        local for ordinary stills; FLUX 3 for high-detail work (--detail high: thumbnail backgrounds, hero
  #                 shots) when REPLICATE_API_TOKEN is set, otherwise local as well
  # One run can override it: --engine local | --engine cloud. Every local run takes a fresh random seed (recorded in
  # credits.json; remake one with --seed). Setup once: npm run setup:image (sd.cpp + models into models/image/).
  mode: cloud_render

  local:
    sdcpp: models/image/sdcpp/sd-cli.exe                       # stable-diffusion.cpp (CUDA 12 build)
    model: models/image/z_image_turbo-Q4_K.gguf                # Z-Image Turbo, Q4_K GGUF (~3.9 GB)
    text_encoder: models/image/Qwen3-4B-Instruct-2507-Q4_K_M.gguf   # stock Qwen3-4B (the one sd.cpp documents)
    vae: models/image/flux1_ae.safetensors                     # FLUX.1 VAE
    width: 1600           # rendered size, then scaled to 1920x1080 (multiples of 64; ~1.4 MP is Turbo's sweet spot)
    height: 896
    steps: 8              # Turbo is distilled for 8; 6 is faster and a little softer
    cfg: 1.5              # 1.0 = fastest (~35 s) but ignores the negative prompt; above 1 the negative applies and
                          # each step runs twice (~55 s). 1.5 is cleaner than 1.0 with little change in look; 2.0+
                          # pushes contrast and saturation
    shift: 3.0            # flow shift (Turbo's default)
    sampler: euler
    scheduler: discrete
    negative_prompt: >-
      blurry, out of focus, low quality, jpeg artifacts, noise, oversaturated, overexposed, watermark, signature,
      logo, text, caption, letters, garbled text, deformed, distorted, extra limbs, malformed hands, bad anatomy,
      duplicate, cropped, frame, border
    offload_to_cpu: true  # keep weights in RAM and move each model to the GPU when it runs (needed on 8 GB)
    flash_attention: true
    vae_tiling: false     # true lowers VRAM for big sizes, a little slower

  cloud:
    resolution: 2k        # FLUX 3 output size: 1k | 1.5k | 2k | 4k (2k for anything shown full-screen)
    safety: 2             # 0 (strictest) .. 4

licensing:
  # Official manufacturer press images: product shots from a company's newsroom or press kit (NVIDIA, AMD, Intel,
  # Apple...), used to show the product a segment discusses. They are "editorial use" material, not CC: this is a
  # risk you accept (fair-use commentary; low in practice, since makers publish them for coverage). The rules check
  # enforces: credited "PRESS" with the company as author and the press page as sourceUrl; images/ and clips/ only;
  # never the thumbnail; never in the shared library. Only the maker's own images: no retailer listing photos, no
  # photographers' or outlets' photos, nothing with a "do not use" or embargo notice.
  #   true:  sourcing agents may use them when no PD/CC media shows the product
  #   false: PD / CC0 / CC BY / CC BY-SA, own work and AI stills only (check errors on PRESS credits)
  press_images: true

  # Free stock sites with their own licenses (not CC): Pixabay (API, free key: PIXABAY_API_KEY), Pexels (API key
  # PEXELS_API_KEY; new keys paused as of 2026-10-23, so import browser downloads) and Coverr (browser downloads
  # only). Fetched with `npm run stock` (the stock-media skill), credited "STOCK" with the site, id, license and date.
  # Risks you accept: YouTube Content ID claims (contributors can register clips; dispute with the raw/stock/ record),
  # uploaders who don't own what they post, and AI uploads the APIs don't flag. check enforces: images/ and clips/
  # only, never the thumbnail, never the shared library, an on-screen note on clips marked AI. Vecteezy and
  # Imagine.Art are excluded (attribution and budget caps; no clear commercial grant).
  #   music-video: music videos search these sites first, before archive footage and AI stills
  #   off:         not used anywhere (check errors on STOCK credits). News episodes never use them.
  stock_media: music-video

youtube:
  # YouTube as a research source and, for Creative Commons videos, a clip source (the youtube skill;
  # npm run youtube). No API key: search, transcripts and clips go through yt-dlp. YouTube's Terms of Service
  # restrict downloading even for CC BY videos: clips go only through `npm run youtube clip`, CC BY or federal PD,
  # credited and tagged on screen. This is a risk you accept by using it.
  #   search_youtube true:  the producer searches YouTube during the fact-check and asset steps, previews each
  #                         transcript's first ~300 words, and reads the full transcript of the useful ones.
  #   search_youtube false: no YouTube (no search, transcripts or clips) unless you ask for it.
  search_youtube: true
  #   use_video_as_citation true:  a video can be a cited source (listed in sources, on the sources card).
  #   use_video_as_citation false: videos are leads only; a fact from one is used only when a non-YouTube source
  #                                confirms it, and that source is cited instead.
  use_video_as_citation: true

x_posts:
  # Posts on X as sources (npm run xpost; CLAUDE.md rules 2 and 3). Only posts by an account that speaks officially
  # for the company, agency or military involved, or by someone widely recognized in that field, with the reason
  # stated (--basis). They count for what that person or organization said, attributed in the script.
  #   true:  such a post can be cited in sources. npm run xpost archives it with the episode (the post's text, author,
  #          date and a screenshot in episodes/<slug>/raw/xpost/<id>/), and with --still makes an on-screen image of
  #          it, credited "X POST" (images/ only, never the thumbnail). Risk you accept: screenshots of posts are
  #          shown as commentary, not under a CC license.
  #   false: posts on X are leads only; check errors on an X link in sources or an X POST credit.
  enabled: false

recon:
  # Video ideas from X (the recon skill; say "recon"). Claude reads these pages in your own browser (Brave, through
  # the Claude browser extension, signed in to X), read-only: it never likes, posts, follows or replies. It groups
  # the posts by story, ranks the stories by how many different accounts are posting about them, and reports a list
  # with a blurb on each. A copy lands in recon/<date>.md (local only) so later runs skip ideas you've seen.
  # Setup: the Claude extension in Brave, signed in to the same claude.ai account; /chrome -> Enabled by default.
  lists:
    - https://x.com/i/lists/1672634236292169729
    - https://x.com/i/lists/1614065972239040514
  trending:
    - https://x.com/explore/tabs/trending
    - https://x.com/explore/tabs/news
  hours_back: 48    # how far back to read each list
  max_posts: 120    # about this many posts per list, then stop even inside the window
  trend_dives: 5    # at most this many trends opened to see what they're about
  ideas: 8          # at most this many ideas in the report
  min_accounts: 3   # a story needs posts from at least this many different accounts

recon_light:
  # Quick recon (the recon-light skill; say "recon light"): the newest posts on each list in recon: lists plus the top
  # of the trending tab, read-only in your browser, and the whole output is one file, recon/light/<date>-<HHmm>.md,
  # with the top few things you might be interested in, shown in chat too. No trend dives, no News tab.
  posts_per_list: 50  # newest posts read on each list (no time window)
  trends: 20          # first this many trends on x.com/explore/tabs/trending
  picks: 5            # items in the file (fewer if fewer are worth it)
  model: haiku        # model that does the reading and writing, in its own agent: haiku, sonnet or opus (latest of
                      # each), or main to do it in the current session on whatever model that runs. A change applies
                      # to the next run.

upload:
  # Themes whose videos go to ANOTHER channel (the user's rule, 2026-11-01): Claude never uploads them. Enforced in
  # code: npm run pick-file refuses their files (out/<slug>/, public/episodes/<slug>/), npm run upload-text still writes
  # the title and description for you to post by hand but marks upload.json "doNotUpload" and never records a link,
  # the youtube-upload skill stops before opening YouTube, and the auto run never uses these themes. A Short counts as
  # its parent's theme, whatever theme it was given.
  blocked_themes: [car-comparisons]

asked_claude:
  # "Asked Claude" (the asked-claude skill; npm run new -- <slug> --format asked-claude): Claude answers a question with
  # its own opinion, in its own look (theme asked-claude) and its own voice. No length limit: as long as the answer needs.
  voice:
    # npm run voice uses these for any episode in theme asked-claude (and Shorts cut from one), instead of voice.engine
    # and voice.reference; --engine / --reference still override one run.
    engine: qwen-cloud              # same Qwen3-TTS clone as the channel default, run on Replicate
    reference: voices/asked_claude.wav  # chosen by Claude 2026-11-02: VCTK speaker p294 (CSTR, University of Edinburgh,
                                    # CC BY 4.0, a corpus recorded for building TTS voices). Credit and changes:
                                    # voices/asked_claude_LICENSE.txt. Alternates: voices/vctk_p343.wav, voices/vctk_p311.wav
  brand:                            # written into each new Asked Claude episode (never carried from other themes)
    name: ASKED CLAUDE
    tagline: AN AI'S OPINION

auto_long_shorts:
  # The scheduled auto run (scripts/auto/daily-run.ps1 via Task Scheduler, 05:00 and 17:00; install or remove with
  # scripts/auto/install-task.ps1 [-Remove]): recon, then the auto-long-shorts skill makes the best ideas from that
  # report into long Shorts end to end, with no handoffs, and uploads them. Run report: recon/runs/<date>-<HHmm>.md.
  min: 3             # aim for at least this many; fewer only when fewer ideas survive the similarity and fact checks
  max: 3             # never more than this many per run (3 per session since 2026-11-01; was 7)
  min_free_gb: 25    # C: must have this much free space or the run stops before producing anything
  max_agents: 3      # background agents running at once, nested ones included; the rest wait in a queue (since
                     # 2026-11-01: fewer agents = less RAM and usage, and the first Short reaches YouTube sooner)
  visibility: private  # uploads stay Private; publishing is yours
  voiceEngine: elevenlabs  # the auto run voices its long Shorts with ElevenLabs (voice.elevenlabs: hacker_01), not
                           # shorts.long.voiceEngine (the user's choice, 2026-11-02: faster than local Qwen). Cloud, so
                           # no GPU queue for voicing; billed per character (~2,300 per Short). Hand-made long Shorts
                           # keep shorts.long.voiceEngine.

agents:
  # Which model each delegated production step runs on, when Claude hands a step to a subagent (CLAUDE.md "Agents").
  #   opus:   the latest Claude Opus, high reasoning effort.
  #   sonnet: the latest Claude Sonnet, high reasoning effort (cheaper and faster; see the trade-offs below).
  # Steps that share a model run in one agent, in order. A change takes effect for agents started after it; agents
  # already running keep their model. Compose, render and upload always run in the main session, one at a time.
  similarity: sonnet   # before research, every episode and Short: compare the idea with existing videos; skip it, make it
                       # an update, or go ahead as new (new-episode skill, section 0). Listing and reading: low risk.
  research: sonnet     # find and read sources, write research.md and article.md. Mostly retrieval: low risk.
  factcheck: sonnet    # verify the premise and every figure, fill the notes.md fact-check table. The judgment step;
                       # the review below covers it.
  script: sonnet       # write voiceover.txt (word count, markers, ear rules) when delegated, i.e. batches such as the
                       # auto run. A one-off video's script is written in the main session (opus) instead: a ~300-word
                       # script costs little, and it saves a round of review fixes (the user's choice, 2026-11-01).
  review: opus         # read notes.md, article.md and voiceover.txt before voicing, and the credits table and contact
                       # sheets after sourcing; fix what's wrong. Keep this on opus when the steps above are sonnet.
  media: sonnet        # find, license-check, download and credit the footage and stills. The biggest token cost.
  production: opus     # everything else a producer agent does: voice and the final voice pass, infographics,
                       # episode.json, assets, check and the test stills.
