<!doctype html>
<!--
  Brief Kit infographic template: animated horizontal bar comparison.
  Copy to episodes/<slug>/infographics/<name>.html, edit DATA and the text, then:
    npm run infographic -- <slug> <name>            (12 s MP4: bars grow in ~2.5 s, then hold)
    npm run infographic -- <slug> <name> --still    (PNG of the finished state)
  The renderer injects the theme as CSS variables and fonts; don't hard-code colors or font names.
  Every number must come from the script / fact-check log. Say where in <meta name="sources">.
-->
<html>
<head>
<meta charset="utf-8">
<title>Operational range compared</title>
<meta name="sources" content="CSIS Missile Threat, 2026; Reuters, Oct 2026">
<style>
  /* Safe area: the kit zooms b-roll up to 1.18x and drifts it 30px, so keep content inside this box. */
  .safe { position: absolute; left: 200px; right: 200px; top: 120px; bottom: 120px; display: flex; flex-direction: column; }

  .kicker { font-family: var(--font-mono); font-weight: 700; font-size: 30px; letter-spacing: 8px; text-transform: uppercase; color: var(--accent);
            display: flex; align-items: center; gap: 20px; animation: rise 600ms cubic-bezier(.2,.8,.2,1) both; }
  .kicker::before { content: ""; width: 80px; height: 4px; background: var(--accent); }
  h1 { font-family: var(--font-display); font-size: 104px; line-height: .95; margin: 18px 0 44px; text-transform: uppercase; text-shadow: var(--text-shadow);
       animation: rise 700ms 120ms cubic-bezier(.2,.8,.2,1) both; }

  .rows { display: flex; flex-direction: column; gap: 34px; flex: 1; justify-content: center; }
  .row { display: grid; grid-template-columns: 340px 1fr 300px; align-items: center; gap: 28px; }
  .label { font-family: var(--font-body); font-weight: 800; font-size: 44px; text-transform: uppercase; text-align: right; line-height: 1; }
  .track { height: 64px; background: var(--panel); border: 1px solid var(--line); position: relative; }
  .bar { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--highlight); }
  .row.top .bar { background: var(--accent); box-shadow: var(--accent-glow); }
  .value { font-family: var(--font-display); font-size: 68px; white-space: nowrap; color: var(--highlight); line-height: 1; font-variant-numeric: tabular-nums; }
  .row.top .value { color: var(--accent); }

  .source { font-family: var(--font-mono); font-size: 24px; letter-spacing: 3px; text-transform: uppercase; color: var(--dim); margin-top: 36px;
            animation: fade 600ms 2400ms both; }

  @keyframes rise { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: none; } }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
</style>
</head>
<body>
<div class="safe">
  <div class="kicker">Range compared</div>
  <h1>How far they reach</h1>
  <div class="rows" id="rows"></div>
  <div class="source">Source: CSIS Missile Threat · Reuters</div>
</div>

<script>
  // EXAMPLE DATA: replace with figures from the script / fact-check log, and update <title>, <meta name="sources"> and .source.
  // label, value, display unit. `top: true` marks the row to emphasize (accent color).
  const DATA = [
    { label: "Geran-2", value: 2500, unit: "KM" },
    { label: "Geran-3", value: 2500, unit: "KM" },
    { label: "Geran-4", value: 400, unit: "KM", top: true },
    { label: "Lancet", value: 70, unit: "KM" },
  ];
  const START = 500, STAGGER = 180, GROW = 1400; // ms
  const max = Math.max(...DATA.map((d) => d.value));
  const fmt = (n) => Math.round(n).toLocaleString("en-US");
  const ease = (t) => 1 - Math.pow(1 - Math.min(1, Math.max(0, t)), 3);

  const rows = document.getElementById("rows");
  const els = DATA.map((d) => {
    const row = document.createElement("div");
    row.className = "row" + (d.top ? " top" : "");
    row.innerHTML = `<div class="label">${d.label}</div><div class="track"><div class="bar"></div></div><div class="value"></div>`;
    rows.appendChild(row);
    return { d, bar: row.querySelector(".bar"), value: row.querySelector(".value") };
  });

  // Called by the renderer for every frame (ms since start). Draw purely from `ms`: no timers, no rAF.
  window.bkSeek = (ms) => {
    els.forEach(({ d, bar, value }, i) => {
      const k = ease((ms - START - i * STAGGER) / GROW);
      bar.style.width = `${(100 * k * d.value) / max}%`;
      value.textContent = `${fmt(k * d.value)} ${d.unit}`;
    });
  };
  window.bkSeek(1e9); // finished state when the file is opened in a normal browser
</script>
</body>
</html>
